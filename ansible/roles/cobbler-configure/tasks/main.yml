---
# =============================================================================
# cobbler-configure — Configure Cobbler settings, DHCP, kickstart
# =============================================================================
# Uses cobbler-settings CLI to modify the RPM default settings.yaml.
# This preserves all required fields that Cobbler validates on startup.
# Works for both fresh installs and re-runs.

# --- Ensure cobblerd is stopped before modifying settings ---
- name: Stop cobblerd if running (settings will be modified)
  ansible.builtin.systemd:
    name: cobblerd
    state: stopped
  failed_when: false

# --- Modify settings using cobbler-settings CLI (works without cobblerd running) ---
- name: Set server IP (PXE clients reach Cobbler here)
  ansible.builtin.command: cobbler-settings modify -k server -v "{{ cobbler_pxe_ip }}"

- name: Set next_server_v4 (TFTP server for PXE)
  ansible.builtin.command: cobbler-settings modify -k next_server_v4 -v "{{ cobbler_pxe_ip }}"

- name: Enable DHCP management
  ansible.builtin.command: cobbler-settings modify -k manage_dhcp -v 1

- name: Enable DHCP v4 management
  ansible.builtin.command: cobbler-settings modify -k manage_dhcp_v4 -v 1

- name: Enable TFTP management
  ansible.builtin.command: cobbler-settings modify -k manage_tftpd -v 1

- name: Set pxe_just_once
  ansible.builtin.command: cobbler-settings modify -k pxe_just_once -v 1

- name: Set default password
  ansible.builtin.command: >
    cobbler-settings modify -k default_password_crypted
    -v "{{ cobbler_default_password_crypted }}"

# --- Deploy modules.conf ---
- name: Deploy Cobbler modules.conf
  ansible.builtin.template:
    src: modules.conf.j2
    dest: /etc/cobbler/modules.conf
    owner: root
    group: root
    mode: "0644"
    backup: true

# --- Deploy DHCP template ---
- name: Deploy DHCP template
  ansible.builtin.template:
    src: dhcp.template.j2
    dest: /etc/cobbler/dhcp.template
    owner: root
    group: root
    mode: "0644"
    backup: true

# --- Deploy kickstart ---
- name: Ensure kickstart templates directory exists
  ansible.builtin.file:
    path: /var/lib/cobbler/templates
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy RHEL 9 kickstart template
  ansible.builtin.template:
    src: kickstart-rhel9.ks.j2
    dest: /var/lib/cobbler/templates/kickstart-rhel9.ks
    owner: root
    group: root
    mode: "0644"

# --- Start cobblerd with configured settings ---
- name: Start cobblerd
  ansible.builtin.systemd:
    name: cobblerd
    state: started

- name: Wait for cobblerd to be ready
  ansible.builtin.wait_for:
    port: 25151
    host: 127.0.0.1
    timeout: 60

# --- Generate bootloaders and sync ---
- name: Generate boot loaders (UEFI + BIOS)
  ansible.builtin.command: cobbler mkloaders
  register: mkloaders_result
  changed_when: true

- name: Run cobbler sync
  ansible.builtin.command: cobbler sync
  register: sync_result
  changed_when: true

- name: Display sync result
  ansible.builtin.debug:
    msg: "{{ sync_result.stdout_lines | default([]) }}"
